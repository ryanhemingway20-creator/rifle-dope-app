name: Build APK

# Builds the installable (debug-signed) APK on every push to main, and whenever
# you trigger it by hand from the Actions tab. The finished APK is attached two
# ways: as a run artifact (zipped, needs a GitHub login) and as an asset on a
# rolling "latest" Release (a direct, phone-friendly download link).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rifle-config.apk
          echo "path=rifle-config.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: rifle-config-apk
          path: rifle-config.apk
          if-no-files-found: error

      - name: Publish to rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rifle Config (latest build)
          body: |
            Latest debug build of the Rifle Config Android app.

            **Install:** download `rifle-config.apk` below on your phone, open it,
            and allow "install from unknown sources" if Android asks. Then open the
            app, tap Scan, and connect to the Waveshare board over Bluetooth.

            This is a debug-signed build for sideloading, not a Play Store release.
          files: rifle-config.apk
          make_latest: true
